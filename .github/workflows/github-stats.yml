name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: sebastianillges
          BRANCH_NAME: main
          UTC_OFFSET: 1
          THEME: github_dark
          ANIMATION: sequence
          DURATION: 1
          NAME: Sebastian Illges
          AUTO_PUSH: true